apiVersion: v1
kind: Namespace
metadata:
  name: clouddesk

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adservice
  namespace: clouddesk
spec:
  replicas: 1
  selector:
    matchLabels:
      app: adservice
  template:
    metadata:
      labels:
        app: adservice
    spec:
      containers:
        - name: adservice
          image: clouddeskacr.azurecr.io/adservice:latest
          ports:
            - containerPort: 9555

---
apiVersion: v1
kind: Service
metadata:
  name: adservice
  namespace: clouddesk
spec:
  selector:
    app: adservice
  ports:
    - port: 9555
      targetPort: 9555

