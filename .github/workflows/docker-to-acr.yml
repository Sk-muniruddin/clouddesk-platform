name: Build and Push Docker Images to ACR

on:
  push:
    branches:
      - test-cloudedesk

  pull_request:
    branches:
      - test-cloudedesk

permissions:
  contents: read
  id-token: write

env:
  REGISTRY: ${{ vars.ACR_LOGIN_SERVER }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: adservice
            context: services/adservice
            dockerfile: services/adservice/Dockerfile

          - service: cartservice
            context: services/cartservice/src
            dockerfile: services/cartservice/src/Dockerfile

          - service: checkoutservice
            context: services/checkoutservice
            dockerfile: services/checkoutservice/Dockerfile

          - service: currencyservice
            context: services/currencyservice
            dockerfile: services/currencyservice/Dockerfile

          - service: emailservice
            context: services/emailservice
            dockerfile: services/emailservice/Dockerfile

          - service: frontend
            context: services/frontend
            dockerfile: services/frontend/Dockerfile

          - service: paymentservice
            context: services/paymentservice
            dockerfile: services/paymentservice/Dockerfile

          - service: productcatalogservice
            context: services/productcatalogservice
            dockerfile: services/productcatalogservice/Dockerfile

          - service: recommendationservice
            context: services/recommendationservice
            dockerfile: services/recommendationservice/Dockerfile

          - service: shippingservice
            context: services/shippingservice
            dockerfile: services/shippingservice/Dockerfile

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Azure login
        if: github.event_name == 'push'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        if: github.event_name == 'push'
        run: |
          az acr login --name "${{ vars.ACR_NAME }}"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max