name: Deploy to AKS

on:
  workflow_run:
    workflows: ["Build and Push Docker Images to ACR"]
    types:
      - completed

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    env:
      ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
      AKS_RESOURCE_GROUP: rg-clouddesk-devops
      AKS_CLUSTER_NAME: aks-clouddesk
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Checkout application commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CD_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group "$AKS_RESOURCE_GROUP" \
            --name "$AKS_CLUSTER_NAME" \
            --admin \
            --overwrite-existing

      - name: Render immutable image tags
        shell: bash
        run: |
          sed -i "s#clouddeskacr.azurecr.io/\([^:]*\):latest#${ACR_LOGIN_SERVER}/\1:${IMAGE_TAG}#g" \
            k8s/microservices.yaml

      - name: Validate Kubernetes manifests
        run: |
          kubectl apply --dry-run=client -f k8s/microservices.yaml

      - name: Deploy to AKS
        run: |
          kubectl apply -f k8s/microservices.yaml

      - name: Verify frontend rollout
        run: |
          kubectl rollout status deployment/frontend \
            -n clouddesk \
            --timeout=180s

      - name: Verify Kubernetes workloads
        run: |
          kubectl get deployments -n clouddesk
          kubectl get pods -n clouddesk
          kubectl get services -n clouddesk